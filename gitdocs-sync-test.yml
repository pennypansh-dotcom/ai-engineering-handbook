name: GitDocs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pennypansh-dotcom/gitdocs-sync@v0.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: "true"
        env:
          GITDOCS_LICENSE_KEY: ${{ secrets.GITDOCS_LICENSE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
